server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- API reverse proxy (matches Vite dev proxy paths) ---
    # Forward API calls to the gateway service inside the docker network.
    location ^~ /users/api {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /materials/api {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /classrooms/api {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static files + SPA routing ---
    location / {
        # If the requested file isn't found, serve index.html so client-side routing works.
        try_files $uri $uri/ /index.html;
    }
}

