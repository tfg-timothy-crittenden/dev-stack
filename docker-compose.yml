services:
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8025/ || exit 1" ]
      interval: 5s
      timeout: 2s
      retries: 12
    networks:
      - tfg-net
  eureka:
    image: ghcr.io/tfg-timothy-crittenden/eureka:latest
    container_name: eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || wget -qO- http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - tfg-net

  user-db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - tfg-net

  material-db:
    image: postgres:16-alpine
    container_name: material-db
    environment:
      POSTGRES_DB: material_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - material-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d material_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - tfg-net

  classroom-db:
    image: postgres:16-alpine
    container_name: classroom-db
    environment:
      POSTGRES_DB: classroom_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"
    volumes:
      - classroom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d classroom_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - tfg-net

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - tfg-net
  user-service:
    image: ghcr.io/tfg-timothy-crittenden/user-service:latest
    container_name: user-service
    ports:
      - "18081:8082"
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

      OTEL_SERVICE_NAME: user-service
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"

      JAVA_TOOL_OPTIONS: >-
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Deureka.client.enabled=true
        -Deureka.client.register-with-eureka=true
        -Deureka.client.fetch-registry=true
        -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
        -Deureka.instance.hostname=user-service
        -Deureka.instance.nonSecurePort=8082
        -Deureka.instance.preferIpAddress=false

      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

      # Mailpit inside the docker network (service name = mailpit)
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
      APP_MAIL_FROM: no-reply@tfg.local

    volumes:
      - otel-java-agent:/otel:ro

    depends_on:
      eureka:
        condition: service_healthy
      user-db:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      otel-java-agent-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

    restart: unless-stopped
    networks:
      - tfg-net

  material-service:
    image: ghcr.io/tfg-timothy-crittenden/material-service:latest
    container_name: material-service
    ports:
      - "18082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MESSAGING_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLASSROOM_INTERNAL_API_KEY: change-me-dev-internal-api-key
      CLASSROOM_AUTH_BASE_URL: http://gateway:8080
      SPRING_APPLICATION_NAME: material-service
      MINIO_PUBLIC_URL: http://localhost:9000 #Ensure presigned urls can be reached from outside the docker compose network
      SPRING_DATASOURCE_URL: jdbc:postgresql://material-db:5432/material_db?stringtype=unspecified #Needed to prevent JSON strings from being interpreted as VARCHAR
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      OTEL_SERVICE_NAME: material-service
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Deureka.client.enabled=true
        -Deureka.client.register-with-eureka=true
        -Deureka.client.fetch-registry=true
        -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
        -Deureka.instance.hostname=material-service
        -Deureka.instance.nonSecurePort=8082
        -Deureka.instance.preferIpAddress=false
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
    volumes:
      - otel-java-agent:/otel:ro
    depends_on:
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy
      material-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      otel-java-agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - tfg-net
  gateway:
    build:
      context: ../tfg-gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka
      EUREKA_PORT: "8761"
      SERVICE_IP: gateway
      SERVER_PORT: "8080"
      OTEL_SERVICE_NAME: gateway
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/otel/opentelemetry-javaagent.jar
    volumes:
      - otel-java-agent:/otel:ro
    depends_on:
      eureka:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      otel-java-agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - tfg-net

  frontend:
    image: ghcr.io/tfg-timothy-crittenden/tfg-frontend:latest

    environment:
      API_UPSTREAM: http://gateway:8080
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      # Local dev: inject Nginx config to enable SPA routing + API reverse proxy.
      # If the frontend image bakes this config in (template + envsubst),
      # you can remove this bind-mount.
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    networks:
      - tfg-net

  classroom-service:
    image: ghcr.io/tfg-timothy-crittenden/classroom-service:latest
    container_name: classroom-service
    ports:
      - "18083:8082"
      - "19093:9093" # optional, useful if you want to test gRPC from the host
    environment:
      # Eureka registration
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "true"
      EUREKA_CLIENT_FETCH_REGISTRY: "true"
      EUREKA_INSTANCE_HOSTNAME: classroom-service
      EUREKA_INSTANCE_NONSECUREPORT: "8082"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"


      # gRPC listener + Eureka metadata
      CLASSROOM_INTERNAL_API_KEY: change-me-dev-internal-api-key
      CLASSROOM_GRPC_PORT: "9093"
      EUREKA_INSTANCE_METADATA_MAP_GRPC_ENABLED: "true"
      EUREKA_INSTANCE_METADATA_MAP_GRPC_HOST: classroom-service
      EUREKA_INSTANCE_METADATA_MAP_GRPC_PORT: "9093"

      # App config
      MESSAGING_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECURITY_INTERNAL_API_KEY: change-me-dev-internal-api-key
      SPRING_APPLICATION_NAME: classroom-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://classroom-db:5432/classroom_db
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_SQL_INIT_MODE: always
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      OTEL_SERVICE_NAME: classroom-service
      OTEL_TRACES_EXPORTER: zipkin
      OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
      JAVA_TOOL_OPTIONS: >-
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Deureka.client.enabled=true
        -Deureka.client.register-with-eureka=true
        -Deureka.client.fetch-registry=true
        -Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
        -Deureka.instance.hostname=classroom-service
        -Deureka.instance.nonSecurePort=8082
        -Deureka.instance.preferIpAddress=false
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

    volumes:
      - otel-java-agent:/otel:ro
    depends_on:
      eureka:
        condition: service_healthy
      classroom-db:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      otel-java-agent-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - tfg-net

  otel-java-agent-init:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
    container_name: otel-java-agent-init
    command:
      - sh
      - -ec
      - >-
        set -eux;
        AGENT=/otel/opentelemetry-javaagent.jar;
        SRC=/javaagent.jar;
        mkdir -p /otel;
        if [ -f "$$AGENT" ]; then
          echo "OpenTelemetry Java agent already present";
          ls -lah "$$AGENT";
          exit 0;
        fi;
        cp "$$SRC" "$$AGENT";
        chmod 444 "$$AGENT" || true;
        echo "Installed:";
        ls -lah /otel;
    volumes:
      - otel-java-agent:/otel
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - tfg-net
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r20
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "zkServer.sh status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - tfg-net

  kafka:
    image: bitnamilegacy/kafka:3.7.0-debian-12-r6
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - tfg-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped
    networks:
      - tfg-net

networks:
  tfg-net:
    driver: bridge

volumes:
  user-db-data:
  material-db-data:
  classroom-db-data:
  otel-java-agent:
  minio-data:


